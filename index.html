<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neptune</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="full">
      <div class="sidebar">
        <div class="sidebar-top">
          <div class="a">
            <img src="Assest/Icons/Union.svg" />
          </div>
          <div class="user-wrapper">
            <div class="b">
              <div class="logo-user">
                <div class="logo">
                  <img height="32px" src="Assest/Icons/Group 79.png" />
                </div>
                <div class="user">
                  <span class="jessica">
                    Jessica Thomsan <br />
                    <span class="primary-user">Primary User</span>
                  </span>
                </div>
              </div>

              <div class="sidebar-arrow">
                <img src="Assest/Icons/Icon Right.png" />
              </div>
            </div>

            <div class="logOut hide">
             
              <button>
                <img src="Assest/Icons/logout.svg" alt="logout-img" class="logout-img"/>
                Logout</button>
            </div>
          </div>

          <div class="list">
            <a class="icon" href="#">
              <div class="icon-img"><img src="Assest/Icons/home 1.png" /></div>
              <div class="icon-name">Home</div>
            </a>
            <a class="icon sidebar-documents" href="#">
              <div class="icon-img">
                <img src="Assest/Icons/file-text 1.png" />
              </div>
              <div class="icon-name">Documents</div>
            </a>
            <a class="icon" href="#">
              <div class="icon-img">
                <img src="Assest/Icons/message-circle 1.png" />
              </div>
              <div class="icon-name">Chat with Neptune</div>
            </a>
            <a class="icon" href="#">
              <div class="icon-img">
                <img src="Assest/Icons/help-circle 1.png" />
              </div>
              <div class="icon-name">Help</div>
            </a>
            <a class="icon" href="#">
              <div class="icon-img">
                <img src="Assest/Icons/settings 1.png" />
              </div>
              <div class="icon-name">Settings</div>
            </a>
          </div>
        </div>
        <div class="footer">
          <div class="footer-img">
            <img src="Assest/Icons/Vector (2).png" class="footer-img" />
          </div>
          <div class="footer-trouble">
            <span>Having trouble?</span>
          </div>
          <div class="footer-para">
            <span
              >Feel free to contact us and we will <br />always help you through
              the process.</span
            >
          </div>
          <div class="footer-button">
            <button>Contacts us</button>
          </div>
        </div>
      </div>

      <div class="main-content">
        <div class="tab1">
          <span class="home">Home</span>
          <img src="Assest/Icons/chevron-right.png" />
          <span class="documents">Documents</span>
        </div>
        <div class="tab2">
          <div class="my-documents">
            <span>My Documents</span>
          </div>
          <div class="addSearchDiv">
            <div class="navAddDocButt">
              <button class="headerAddDocButt"><img src="Assest/Icons/plus.png" class="plusImg"></button>
            </div>
            <div class="search">
              <div class="search-doc">
                <input
                  type="text"
                  placeholder="Search documents"
                  id="searchInput"
                />
              </div>
              <div class="search-img">
                <img src="Assest/Icons/Layer_1.png" />
              </div>
            </div>
          </div>
        </div>

        <table class="table-class">
          <thead>
            <tr>
              <th class="check">
                <div class="checkbox"><input type="checkbox" /></div>
                <div class="arrow">
                  <img src="Assest/Icons/Icon Right (1).png" />
                </div>
              </th>
              <th class="head-row">Document Name</th>
              <th class="head-row">Status</th>
              <th class="head-row">Last Modified</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
    <div class="formAddDoc hide">
      <form id="form_01">
        <div class="addDocDiv">
          <h3 id="formHeader">Add Document</h3>
        </div>
        <div class="titleDiv">
          <label for="Document-Title" class="label1" id="docTit"
            >Document Title:
          </label>
          <input
            type="text"
            placeholder="Your Document Name"
            id="Document-Title"
            class="Document-Title"
            name="docname"
            required
          /><br />
        </div>
        <div class="statusDiv">
          <label for="Status" class="label1">Status: </label>
          <select id="Status" name="status" class="Status" required>
            <option value="">Select Status</option>
            <option value="Needs Signing">Needs Signing</option>
            <option value="Pending">Pending</option>
            <option value="Completed">Completed</option>
          </select>
        </div>
        <div class="for-pending hide">
          <label for="waiting_num">Person Waiting</label>
          <input
            type="number"
            id="waiting_num"
            placeholder="1"
            min="1"
            name="num"
          />
        </div>
          <div>
            <label for="lastModified">Last Modified</label>
            <input type="text" id="lastModified" readonly />
          </div>
        <div class="formButDiv">
          <button type="submit" class="addDocButt" id="addButton">Add</button>
          <button type="button" class="cancelbtn" id="cancelButton">
            Cancel
          </button>
        </div>
      </form>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
